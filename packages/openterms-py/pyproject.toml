[project]
name = "openterms-py"
version = "1.0.1"
description = "OpenTerms Python SDK — permission lookup and ORS v0.1 signed receipts for AI agents."
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "OpenTerms", email = "hello@openterms.com" }]
keywords = ["openterms", "ai", "agents", "permissions", "receipts", "ors", "langchain", "crewai"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=42",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://openterms.com"
Documentation = "https://openterms.com/docs"
Repository = "https://github.com/jstibal/openterms"
"Bug Tracker" = "https://github.com/jstibal/openterms/issues"
"Source" = "https://github.com/jstibal/openterms/tree/main/packages/openterms-py"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "coverage>=7",
    "responses>=0.23",
    "mypy>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["openterms*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
