name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python SDK (unit + canonical parity)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/openterms-py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e ".[dev]" || .venv/bin/pip install -e .
          .venv/bin/pip install pytest
      - name: Test
        run: .venv/bin/pytest -q
